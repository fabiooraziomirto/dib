\* v5_f3_two_split. HYPOTHESIS (declared before any run, docs/audit/67 batch 5): as v5_f2 on both sites, MaxToggles 2. Falsified by any violation; incomplete after 3 h is reported as such.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

