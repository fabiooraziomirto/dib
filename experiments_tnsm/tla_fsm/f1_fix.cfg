\* f1_fix. HYPOTHESIS (declared before any run, docs/audit/67): split s1 WITH FixRace: no violation of any original or new property (I1_CommitOnUndisputedEvidence, NoMonitorOnlyCaughtUpDuringEpisode, CaughtUpIsCoherent included). Falsified by any violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE

INVARIANT
    TypeOK
    CaughtUpIsCoherent
    NoStaleActiveAfterEpisode
    DisputeSuspendsAtReachableSites
    NoMonitorOnlyCaughtUpDuringEpisode
    CommittingIsTransient

PROPERTY
    I1_NonEscalation
    I2_SiteConfinement
    I2_ApplyConfinement
    I3_ConservativeRestore
    I3_VetoPreserved
    UnrelatedFactIsolation
    LastAppliedMonotone
    NoRegression
    OutboxNeverDropsUnapplied
    I1_CommitOnUndisputedEvidence
    RevokeConfirmedByOutsider
