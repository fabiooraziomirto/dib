\* Lv_noae_e1. HYPOTHESIS (declared before any run, docs/audit/93 sez. 9): LIVENESS mutant v7: AntiEntropy FALSE: ConvergedDecisionsEventually is VIOLATED and the counterexample contains a Lose step (a lost event never recovered). Falsified if no violation or no Lose in the trace.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 2
    MaxEvents = 1
    MaxToggles = 0
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = TRUE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE
    MutNoFinishApply = FALSE

INVARIANT
    TypeOK

PROPERTY
    ConvergedDecisionsEventually
