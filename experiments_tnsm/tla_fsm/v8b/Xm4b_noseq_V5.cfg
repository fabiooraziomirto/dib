\* Xm4b_noseq_V5. HYPOTHESIS (declared before any run, docs/audit/110 addendum 8.6): non-vacuity: MutNoSeqGuard=TRUE on the X4b bounds with V5: a listed property is violated. If NOT violated, the bounds do not exercise the guard.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
