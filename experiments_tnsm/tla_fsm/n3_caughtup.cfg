\* n3_caughtup. HYPOTHESIS (declared before any run, docs/audit/67): split s1 WITHOUT FixRace: the ORIGINAL invariant CaughtUpIsCoherent of DIB_AE is VIOLATED by the same b3r trace: the published model's guarantee does not hold for the non-atomic code. Falsified if no violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = FALSE
    Quorum = 1
    ConfirmOutsideVoters = FALSE

INVARIANT
    TypeOK
    CaughtUpIsCoherent
