\* q2_witness. HYPOTHESIS (declared before any run, docs/audit/67): non-vacuity of q2: with the outsider rule and 3 reporters a fact CAN be revoked (NeverRevoked VIOLATED). Falsified if no violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2, r3}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {}
    FixRace = FALSE
    Quorum = 2
    ConfirmOutsideVoters = TRUE

INVARIANT
    TypeOK
    NeverRevoked
