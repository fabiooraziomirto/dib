\* Xm2_failnoclean. HYPOTHESIS (declared before any run, docs/audit/110): mutation: a failing second read of /query that keeps the reservation VIOLATES StagingIsTransient. Falsified if no violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec
VIEW View

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 0
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = TRUE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE
    MutNoFinishApply = FALSE
    MutNoLock = FALSE
    MaxFails = 1
    MaxCrashes = 0
    MutNoD1 = FALSE
    MutFailNoClean = TRUE

INVARIANT
    TypeOK
    StagingIsTransient
