\* v3_mut_veto. HYPOTHESIS (declared before any run, docs/audit/67 batch 3): the corrected I3_VetoPreserved is not vacuous: with both fixes on s1 and MutIgnoreOrigin = TRUE (a fan-out overwrites a local veto) it is VIOLATED. Falsified if no violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = TRUE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = TRUE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE

INVARIANT
    TypeOK

PROPERTY
    I3_VetoPreserved
