\* n5_export_nofix. HYPOTHESIS (declared before any run, docs/audit/67 batch 3 (v3 model)): the PROTOTYPE semantics (split s1, no correction) keep export safety: ExportSafeAtReachableSites, NoStaleActiveAfterEpisode and every original action property hold (the windows produce MonitorOnly records and late commits that the in-flight fan-out withdraws, never an Active record at a reachable caught-up site). Falsified by any violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = FALSE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = FALSE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE

INVARIANT
    TypeOK
    ExportSafeAtReachableSites
    NoStaleActiveAfterEpisode
    CommittingIsTransient
    StagingIsTransient

PROPERTY
    I1_NonEscalation
    I2_SiteConfinement
    I2_ApplyConfinement
    I3_ConservativeRestore
    I3_VetoPreserved
    UnrelatedFactIsolation
    LastAppliedMonotone
    NoRegression
    OutboxNeverDropsUnapplied
