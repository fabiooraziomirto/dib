\* L2_noae_live_e1. HYPOTHESIS (declared before any run, docs/audit/93): LIVENESS mutant 'no reconciliation repair' (AntiEntropy FALSE): a lost event is never recovered: ConvergedEventually is VIOLATED. Falsified if no violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 2
    MaxEvents = 1
    MaxToggles = 0
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = TRUE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE
    MutNoFinishApply = FALSE

INVARIANT
    TypeOK

PROPERTY
    ConvergedEventually
