\* L1b_window_v6. HYPOTHESIS (declared before any run, docs/audit/93): EXPECTED VIOLATION: with MaxLoss 1 ExportSafeAtReachableSites is violated by the D19 window (a lost dispute leaves an Active site with nothing in flight), and the trace contains a Lose step. Falsified if no violation or if the trace has no Lose.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec
VIEW View

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 0
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = TRUE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE
    MutNoFinishApply = FALSE

INVARIANT
    TypeOK
    ExportSafeAtReachableSites
