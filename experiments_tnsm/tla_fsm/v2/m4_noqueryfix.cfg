\* m4_noqueryfix. HYPOTHESIS (declared before any run, docs/audit/67 batch 2): each piece is needed: FixRace without FixQuery violates DisputeSuspendsAtReachableSitesV2 (the b3q trace of n4/f1_fix). Falsified if no violation.
