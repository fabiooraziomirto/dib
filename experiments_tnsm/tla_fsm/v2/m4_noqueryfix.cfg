    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE
    FixQuery = FALSE
    MutNoLRGuard = FALSE
    MutNoVerify = FALSE

