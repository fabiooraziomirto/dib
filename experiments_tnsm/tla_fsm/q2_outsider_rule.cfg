\* q2_outsider_rule. HYPOTHESIS (declared before any run, docs/audit/67): Quorum 2 with the outsider rule (user decision): no violation of any original or new property. Falsified by any violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2, r3}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {}
    FixRace = FALSE
    Quorum = 2
    ConfirmOutsideVoters = TRUE

INVARIANT
    TypeOK
    CaughtUpIsCoherent
    NoStaleActiveAfterEpisode
    DisputeSuspendsAtReachableSites
    NoMonitorOnlyCaughtUpDuringEpisode
    CommittingIsTransient

PROPERTY
    I1_NonEscalation
    I2_SiteConfinement
    I2_ApplyConfinement
    I3_ConservativeRestore
    I3_VetoPreserved
    UnrelatedFactIsolation
    LastAppliedMonotone
    NoRegression
    OutboxNeverDropsUnapplied
    I1_CommitOnUndisputedEvidence
    RevokeConfirmedByOutsider
