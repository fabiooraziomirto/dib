\* e3b_noparts. HYPOTHESIS (declared before any run, docs/audit/92): v6 correction on s1, MaxEvents 3, NO partitions (MaxToggles 0), VIEW View: no violation of any property. Falsified by any violation; stopped by the 3 h cap or the disk watchdog = incomplete, no claim.
