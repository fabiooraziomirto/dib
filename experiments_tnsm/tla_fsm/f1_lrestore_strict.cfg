\* f1_lrestore_strict. HYPOTHESIS (declared before any run, docs/audit/67): diagnostic: even WITH FixRace the strict LocalRestoreOnClosedEpisode is VIOLATED (a dispute committed but not yet delivered when the local restore writes; same window as any fan-out). Falsified if no violation.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 2
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE
    SplitSites = {s1}
    FixRace = TRUE
    Quorum = 1
    ConfirmOutsideVoters = FALSE

INVARIANT
    TypeOK

PROPERTY
    LocalRestoreOnClosedEpisode
