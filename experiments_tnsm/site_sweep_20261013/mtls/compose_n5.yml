services:
  evidence:
    build:
      context: /root/Desktop/DIB_tnsm_final/code
      dockerfile: src/dib/registry/distributed/Dockerfile
    command: ["python", "-m", "dib.registry.distributed.mtls", "--app", "service:app", "--port", "8000"]
    environment:
      - DIB_DIST_ROLE=evidence
      - DIB_DIST_N_SITES=5
      - DIB_DIST_DATA_DIR=/data
      - DIB_DIST_FANOUT_CONCURRENCY=5
      - DIB_DIST_SITE_URL_0=https://site-0:8000
      - DIB_DIST_SITE_URL_1=https://site-1:8000
      - DIB_DIST_SITE_URL_2=https://site-2:8000
      - DIB_DIST_SITE_URL_3=https://site-3:8000
      - DIB_DIST_SITE_URL_4=https://site-4:8000
      - DIB_DIST_MTLS=1
      - DIB_DIST_TLS_CERT=/pki/evidence.crt
      - DIB_DIST_TLS_KEY=/pki/evidence.key
      - DIB_DIST_TLS_CA=/pki/ca.crt
      - DIB_DIST_IDENTITIES=/pki/identities.json
    volumes:
      - evidence_data:/data
      - /tmp/claude-0/-root-Desktop-DIB-tnsm-merged/bf9c37cb-5231-43be-b586-6bfd0e628b8d/scratchpad/pki_phase2/sweep_mtls_2:/pki:ro
