services:
  evidence:
    build:
      context: /root/Desktop/DIB_tnsm_final/code
      dockerfile: src/dib/registry/distributed/Dockerfile
    environment:
      - DIB_DIST_ROLE=evidence
      - DIB_DIST_N_SITES=2
      - DIB_DIST_DATA_DIR=/data
      - DIB_DIST_FANOUT_CONCURRENCY=2
      - DIB_DIST_SITE_URL_0=http://site-0:8000
      - DIB_DIST_SITE_URL_1=http://site-1:8000
    volumes:
      - evidence_data:/data
    ports:
      - "18100:8000"
  site-0:
    build:
      context: /root/Desktop/DIB_tnsm_final/code
      dockerfile: src/dib/registry/distributed/Dockerfile
    environment:
      - DIB_DIST_ROLE=site
      - DIB_DIST_SITE_INDEX=0
      - DIB_DIST_N_SITES=2
      - DIB_DIST_EVIDENCE_URL=http://evidence:8000
      - DIB_DIST_DATA_DIR=/data
      - DIB_DIST_RECONCILE_INTERVAL=5
      - DIB_DIST_RECONCILE_JITTER=0.5
      - DIB_DIST_RECONCILE_TIMEOUT=5.0
    volumes:
      - site_0_data:/data
    depends_on:
      - evidence
    ports:
      - "18110:8000"
  site-1:
    build:
      context: /root/Desktop/DIB_tnsm_final/code
      dockerfile: src/dib/registry/distributed/Dockerfile
    environment:
      - DIB_DIST_ROLE=site
      - DIB_DIST_SITE_INDEX=1
      - DIB_DIST_N_SITES=2
      - DIB_DIST_EVIDENCE_URL=http://evidence:8000
      - DIB_DIST_DATA_DIR=/data
      - DIB_DIST_RECONCILE_INTERVAL=5
      - DIB_DIST_RECONCILE_JITTER=0.5
      - DIB_DIST_RECONCILE_TIMEOUT=5.0
    volumes:
      - site_1_data:/data
    depends_on:
      - evidence
    ports:
      - "18111:8000"
volumes:
  evidence_data:
  site_0_data:
  site_1_data:
