\* Robustness: V1 with THREE real sites (D19, liveness)
\* HYPOTHESIS (declared before any run): ConvergedEventually is VIOLATED as in v1_conv.
\* WOULD FALSIFY IT: no violation: the 2-site result does not carry over.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2, s3}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    ConvergedEventually
