\* Non-vacuity of the CORRECTED I3_ConservativeRestore: MutWriteActive must violate it
\* HYPOTHESIS (declared before any run): I3_ConservativeRestore (corrected, antecedent seq > last_applied) is VIOLATED when an applied restore lands in Active.
\* WOULD FALSIFY IT: no violation: the corrected property is vacuous (its antecedent is never true or never matters).
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = TRUE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    I3_ConservativeRestore
