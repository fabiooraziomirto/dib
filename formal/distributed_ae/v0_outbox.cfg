\* V0: D12 as an action property
\* HYPOTHESIS (declared before any run): OutboxNeverDropsUnapplied is VIOLATED by the delete-all ack.
\* WOULD FALSIFY IT: no violation: the ack of the model never drops an unapplied row, or the property is ill-formed.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = FALSE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    OutboxNeverDropsUnapplied
