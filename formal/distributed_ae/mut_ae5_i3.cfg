\* Non-vacuity, second mutant: MutRestoreKeepsActive vs the corrected I3_ConservativeRestore
\* HYPOTHESIS (declared before any run): I3_ConservativeRestore (corrected) is VIOLATED when an applied restore leaves an Active site Active.
\* WOULD FALSIFY IT: no violation: see mut_ae2_i3.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = TRUE

PROPERTY
    I3_ConservativeRestore
