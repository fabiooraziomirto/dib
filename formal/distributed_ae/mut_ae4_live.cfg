\* M-AE4 non-atomic snapshot [liveness]
\* HYPOTHESIS (declared before any run): PREDICTION: no liveness violation.
\* WOULD FALSIFY IT: any violation is reported as found.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = TRUE
    MutRestoreKeepsActive = FALSE

PROPERTY
    ConvergedEventually
    ExposureEnds
