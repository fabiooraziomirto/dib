\* V2a with two facts
\* HYPOTHESIS (declared before any run): same as v2a with two facts.
\* WOULD FALSIFY IT: any violation: reported as found.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1, f2}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

INVARIANT
    TypeOK
    CaughtUpIsCoherent
    NoStaleActiveAfterEpisode
    DisputeSuspendsAtReachableSites

PROPERTY
    I1_NonEscalation
    I2_SiteConfinement
    I2_ApplyConfinement
    I3_ConservativeRestore
    I3_VetoPreserved
    UnrelatedFactIsolation
    LastAppliedMonotone
    NoRegression
    OutboxNeverDropsUnapplied
    ConvergedEventually
    ExposureEnds
