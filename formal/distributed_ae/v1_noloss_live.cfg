\* V1 control, no loss [liveness]
\* HYPOTHESIS (declared before any run): convergence holds.
\* WOULD FALSIFY IT: any violation is reported as found.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    ConvergedEventually
