\* Negative control of the liveness: V2b WITHOUT fairness (Spec, not SpecL)
\* HYPOTHESIS (declared before any run): ConvergedEventually is VIOLATED by stuttering: the liveness is not vacuous.
\* WOULD FALSIFY IT: no violation: the property holds without fairness, i.e. it is vacuous or too weak.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    ConvergedEventually
