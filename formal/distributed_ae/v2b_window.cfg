\* V2b window: the exposure window between a lost event and the repair
\* HYPOTHESIS (declared before any run): DisputeSuspendsAtReachableSites is VIOLATED when an event is lost (nothing in flight, site not yet repaired): this is the declared window, closed only by liveness.
\* WOULD FALSIFY IT: no violation: the loss does not leave a window, contradicting audit 06.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

INVARIANT
    DisputeSuspendsAtReachableSites
