\* V0: lag not covered
\* HYPOTHESIS (declared before any run): LagCoveredByQueue is VIOLATED (a lagging site with nothing queued or in flight).
\* WOULD FALSIFY IT: no violation: same reading as v0_conv.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = FALSE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

INVARIANT
    LagCoveredByQueue
