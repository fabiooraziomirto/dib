\* M-AE1: AE/apply ignores the local origin (veto)
\* HYPOTHESIS (declared before any run): I3_VetoPreserved is VIOLATED.
\* WOULD FALSIFY IT: no violation: the local veto is unreachable in the bound (raise MaxEvents) or not exposed to the repair.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = TRUE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    I3_VetoPreserved
