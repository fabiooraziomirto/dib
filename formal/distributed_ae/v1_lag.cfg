\* V1: lag not covered after a loss
\* HYPOTHESIS (declared before any run): LagCoveredByQueue is VIOLATED when MaxLoss = 1.
\* WOULD FALSIFY IT: no violation: same reading as v1_conv.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 1
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

INVARIANT
    LagCoveredByQueue
