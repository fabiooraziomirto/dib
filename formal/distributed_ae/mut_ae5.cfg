\* M-AE5: a restore does not touch an Active site (old Reconcile, D6/B3)
\* HYPOTHESIS (declared before any run): NoStaleActiveAfterEpisode is VIOLATED (a site Active through a whole episode stays Active).
\* WOULD FALSIFY IT: no violation: the property is vacuous.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = TRUE

INVARIANT
    NoStaleActiveAfterEpisode
