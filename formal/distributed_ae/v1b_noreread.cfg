\* V1b (AE off, ack per pair, NO re-read, no loss): exploratory
\* HYPOTHESIS (declared before any run): converges (the row survives the ack, the next run applies it); the safety properties hold; ExposureEnds may show the residual window of audit 03.
\* WOULD FALSIFY IT: none declared (exploratory): reported as found.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = FALSE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

INVARIANT
    TypeOK
    CaughtUpIsCoherent
    NoStaleActiveAfterEpisode

PROPERTY
    I1_NonEscalation
    I2_SiteConfinement
    I2_ApplyConfinement
    I3_ConservativeRestore
    I3_VetoPreserved
    UnrelatedFactIsolation
    LastAppliedMonotone
    NoRegression
    OutboxNeverDropsUnapplied
    ConvergedEventually
    ExposureEnds
