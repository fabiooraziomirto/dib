\* V0 with TWO facts: the ack deletes the row of ANOTHER fact (exposure variant of D12)
\* HYPOTHESIS (declared before any run): OutboxNeverDropsUnapplied is VIOLATED; needs MaxEvents = 3 (a dispute on Y queued, then dispute+revoke on X in the window).
\* WOULD FALSIFY IT: no violation with 3 events: the cross-fact case is not reached.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1, f2}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = FALSE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    OutboxNeverDropsUnapplied
