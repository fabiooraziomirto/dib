\* M-AE3: no seq guard in the apply
\* HYPOTHESIS (declared before any run): LastAppliedMonotone is VIOLATED (a stale snapshot item regresses last_applied).
\* WOULD FALSIFY IT: no violation: an older snapshot cannot be applied after a newer delivered event in the model.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = TRUE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 3
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = TRUE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

PROPERTY
    LastAppliedMonotone
