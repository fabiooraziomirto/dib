\* V1 control (AE off, ack per pair, re-read on, NO loss): D12 closed
\* HYPOTHESIS (declared before any run): every property holds: convergence, OutboxNeverDropsUnapplied, LagCoveredByQueue, DisputeSuspendsAtReachableSites.
\* WOULD FALSIFY IT: a violation here means the per-pair ack + re-pull do not close D12 in the model.
\* Bounds: results hold ONLY within MaxEvents/MaxLoss/MaxToggles below (audit 07).
SPECIFICATION SpecL

CONSTANTS
    Sites = {s1, s2}
    Reporters = {r1, r2}
    Facts = {f1}
    NoSite = nosite
    NoFact = nofact
    PartitionableSites = {s1}
    AllowCommit = TRUE
    AntiEntropy = FALSE
    AckPerPair = TRUE
    ReRead = TRUE
    MaxLoss = 0
    MaxRounds = 3
    MaxEvents = 2
    MaxToggles = 3
    MutIgnoreOrigin = FALSE
    MutWriteActive = FALSE
    MutNoSeqGuard = FALSE
    MutNonAtomicSnapshot = FALSE
    MutRestoreKeepsActive = FALSE

INVARIANT
    TypeOK
    CaughtUpIsCoherent
    LagCoveredByQueue
    DisputeSuspendsAtReachableSites
    NoStaleActiveAfterEpisode

PROPERTY
    I1_NonEscalation
    I2_SiteConfinement
    I2_ApplyConfinement
    I3_ConservativeRestore
    I3_VetoPreserved
    UnrelatedFactIsolation
    LastAppliedMonotone
    NoRegression
    OutboxNeverDropsUnapplied
    ConvergedEventually
